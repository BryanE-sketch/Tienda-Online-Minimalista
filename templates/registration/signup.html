{% extends 'base.html' %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Crear cuenta</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/form_fields.html' %}
                    <button type="submit" class="btn btn-dark w-100">Crear cuenta</button>
                </form>
                <p class="mt-3 mb-0 text-center small">
                    ¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
